<!DOCTYPE html>
<html lang="en">
<body>
<script>
  const RATES = {
    length: { mm: 0.001, cm: 0.01, m: 1, km: 1000, in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344 },
    weight: { mg: 0.000001, g: 0.001, kg: 1, oz: 0.0283495, lb: 0.453592, ton: 1000 },
    volume: { ml: 0.001, l: 1, tsp: 0.00492892, tbsp: 0.0147868, cup: 0.24, floz: 0.0295735, pint: 0.473176, quart: 0.946353, gal: 3.78541 },
    time: { ms: 0.001, s: 1, min: 60, hr: 3600, day: 86400, week: 604800, month: 2629800, year: 31557600 },
  };

  function convertTemp(value, from, to) {
    let c;
    if (from === 'c') c = value;
    else if (from === 'f') c = (value - 32) * 5 / 9;
    else if (from === 'k') c = value - 273.15;
    else return null;
    if (to === 'c') return c;
    if (to === 'f') return c * 9 / 5 + 32;
    if (to === 'k') return c + 273.15;
    return null;
  }

  function fmt(n) {
    if (!Number.isFinite(n)) return String(n);
    if (Math.abs(n) < 0.0001 || Math.abs(n) >= 1e9) return n.toExponential(4);
    return parseFloat(n.toPrecision(8)).toString();
  }

  window['ai_edge_gallery_get_result'] = async (dataStr) => {
    try {
      const input = JSON.parse(dataStr);
      const value = parseFloat(input.value);
      const from = String(input.from ?? '').toLowerCase().trim();
      const to = String(input.to ?? '').toLowerCase().trim();
      const category = String(input.category ?? '').toLowerCase().trim();

      if (!Number.isFinite(value)) return JSON.stringify({ error: 'Invalid value.' });
      if (!from || !to || !category) return JSON.stringify({ error: 'Missing from/to/category.' });

      if (category === 'temperature' || category === 'temp') {
        const out = convertTemp(value, from, to);
        if (out === null) return JSON.stringify({ result: `Unknown temperature unit. Use c, f, or k.` });
        return JSON.stringify({ result: `${fmt(value)} ${from.toUpperCase()} = ${fmt(out)} ${to.toUpperCase()}` });
      }

      const table = RATES[category];
      if (!table) return JSON.stringify({ result: `Unknown category "${category}". Use length, weight, temperature, volume, or time.` });
      if (!(from in table)) return JSON.stringify({ result: `Unknown ${category} unit "${from}".` });
      if (!(to in table)) return JSON.stringify({ result: `Unknown ${category} unit "${to}".` });

      const base = value * table[from];
      const out = base / table[to];
      return JSON.stringify({ result: `${fmt(value)} ${from} = ${fmt(out)} ${to}` });
    } catch (e) {
      return JSON.stringify({ error: `Unit Converter error: ${e.message}` });
    }
  };
</script>
</body>
</html>
