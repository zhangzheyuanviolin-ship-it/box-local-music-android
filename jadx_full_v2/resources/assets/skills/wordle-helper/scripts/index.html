<script>
  // ~500 common 5-letter words. Good coverage for Wordle without bloating the APK.
  const WORDS_5 = ("about above abuse actor acute admit adopt adult after again agent agree ahead alarm album alert alike alive allow alone along alter among anger angle angry apart apple apply arena argue arise array aside asset audio audit avoid award aware badly baker bases basic basis beach began begin begun being below bench billy birth black blame blind block blood board boost booth bound brain brand bread break breed brief bring broad broke brown build built buyer cable calif carry catch cause chain chair charm chart chase cheap check chest chief child china chose civil claim class clean clear click clock close coach coast could count court cover craft crash cream crime cross crowd crown curve cycle daily dance dated dealt death debut delay depth doing doubt dozen draft drama drawn dream dress drill drink drive drove dying eager early earth eight elite empty enemy enjoy enter entry equal error event every exact exist extra faith false fault fiber field fifth fifty fight final first fixed flash fleet floor fluid focus force forth forty forum found frame frank fraud fresh front fruit fully funny giant given glass globe going grace grade grand grant grass great green gross group grown guard guess guest guide happy harry heart heavy hence henry horse hotel house human ideal image index inner input issue japan jimmy joint jones judge known label large laser later laugh layer learn lease least leave legal level light limit links lives local logic loose lower lucky lunch lying magic major maker march maria match maybe mayor meant media metal might minor minus mixed model money month moral motor mount mouse mouth movie music needs never newly night noise north noted novel nurse occur ocean offer often order other ought paint paper party peace peter phase phone photo piece pilot pitch place plain plane plant plate point pound power press price pride prime print prior prize proof proud prove queen quick quiet quite radio raise range rapid ratio reach ready refer right rival river rives roman rough round route royal rural scale scene scope score sense serve seven shall shape share sharp sheet shelf shell shift shirt shock shoot short shown sight since sixth sixty sized skill sleep slide small smart smile smith smoke solid solve sorry sound south space spare speak speed spend spent split spoke sport staff stage stake stand start state steam steel stick still stock stone stood store storm story strip stuck study stuff style sugar suite super sweet table taken taste taxes teach teeth texas thank theft their theme there these thick thing third those three threw throw tight times tired title today topic total touch tough tower track trade train treat trend trial tried tries truck truly trust truth twice under undue union unity until upper upset urban usage usual valid value video virus visit vital voice waste watch water wheel where which while white whole whose woman women world worry worse worst worth would wound write wrong wrote yield young youth").split(/\s+/);

  function matches(word, greens, yellows, grays) {
    const w = word.toLowerCase();
    for (let i = 0; i < greens.length; i++) {
      const c = greens[i];
      if (c !== '.' && w[i] !== c) return false;
    }
    for (const { letter, notAt } of yellows) {
      if (!w.includes(letter)) return false;
      if (notAt != null && w[notAt] === letter) return false;
    }
    for (const g of grays) {
      const inGreen = greens.includes(g);
      const inYellow = yellows.some(y => y.letter === g);
      if (inGreen || inYellow) continue;
      if (w.includes(g)) return false;
    }
    return true;
  }

  function parseYellows(s) {
    const out = [];
    if (!s) return out;
    const parts = s.split(',').map(x => x.trim()).filter(Boolean);
    for (const p of parts) {
      const m = p.match(/^([a-z]):(\d+)$/i);
      if (m) {
        out.push({ letter: m[1].toLowerCase(), notAt: parseInt(m[2]) - 1 });
      } else if (p.length === 1) {
        out.push({ letter: p.toLowerCase(), notAt: null });
      } else {
        for (const c of p) out.push({ letter: c.toLowerCase(), notAt: null });
      }
    }
    return out;
  }

  window['ai_edge_gallery_get_result'] = async (dataStr) => {
    try {
      const input = JSON.parse(dataStr);
      const length = parseInt(input.length ?? 5);
      const greens = String(input.green ?? '.....').toLowerCase().padEnd(length, '.').slice(0, length);
      const yellows = parseYellows(String(input.yellow ?? ''));
      const grays = String(input.gray ?? '').toLowerCase().split('').filter(c => /[a-z]/.test(c));

      if (length !== 5) {
        return JSON.stringify({ result: 'Only 5-letter words are supported.' });
      }

      const candidates = WORDS_5.filter(w => w.length === length && matches(w, greens, yellows, grays));
      if (candidates.length === 0) {
        return JSON.stringify({ result: 'No candidates found in the built-in word list.' });
      }

      const top = candidates.slice(0, 30);
      const result = `${candidates.length} candidate${candidates.length === 1 ? '' : 's'}${candidates.length > 30 ? ' (showing first 30)' : ''}:\n${top.join(', ')}`;
      return JSON.stringify({ result });
    } catch (e) {
      return JSON.stringify({ error: `Wordle Helper error: ${e.message}` });
    }
  };
</script>
</body>
</html>
