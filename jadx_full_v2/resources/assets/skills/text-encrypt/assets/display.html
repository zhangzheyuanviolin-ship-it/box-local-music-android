<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encrypted Text</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; min-height: 100vh; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 500px; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 8px; background: linear-gradient(to right, #4ecca3, #45b7d1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { text-align: center; color: rgba(255,255,255,0.55); font-size: 0.85rem; margin-bottom: 24px; }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .output {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      word-break: break-all;
      line-height: 1.5;
      color: #4ecca3;
      max-height: 280px;
      overflow-y: auto;
      margin-bottom: 16px;
      padding: 14px;
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
    }
    .copy-btn {
      width: 100%;
      background: linear-gradient(135deg, #4ecca3, #45b7d1);
      border: none;
      color: #1a1a2e;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
    }
    .copy-btn:active { transform: scale(0.98); }
    .copy-btn.copied { background: linear-gradient(135deg, #2ecc71, #27ae60); }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">🔒 Encrypted</h1>
    <p class="subtitle" id="subtitle">AES-256-GCM</p>
    <div class="card">
      <div class="output" id="output">No data</div>
      <button class="copy-btn" id="copy">Copy</button>
    </div>
  </div>
  <script>
    const data = JSON.parse(localStorage.getItem('text_encrypt_result') || '{}');
    if (data.output) {
      document.getElementById('output').textContent = data.output;
      document.getElementById('title').textContent = data.mode === 'encrypt' ? '🔒 Encrypted' : '🔓 Decrypted';
      document.getElementById('subtitle').textContent = data.label || '';
      document.getElementById('copy').addEventListener('click', () => {
        navigator.clipboard.writeText(data.output).then(() => {
          const btn = document.getElementById('copy');
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
        });
      });
    }
  </script>
</body>
</html>
