<!DOCTYPE html>
<html lang="en">
<body>
<script>
  const STORAGE_KEY = 'color_tools_result';

  function parseColor(s) {
    s = String(s ?? '').trim();
    let m;
    if ((m = s.match(/^#([0-9a-f])([0-9a-f])([0-9a-f])$/i))) {
      return { r: parseInt(m[1] + m[1], 16), g: parseInt(m[2] + m[2], 16), b: parseInt(m[3] + m[3], 16) };
    }
    if ((m = s.match(/^#([0-9a-f]{6})$/i))) {
      const n = parseInt(m[1], 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }
    if ((m = s.match(/^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i))) {
      return { r: +m[1], g: +m[2], b: +m[3] };
    }
    if ((m = s.match(/^hsla?\(\s*(\d+(?:\.\d+)?)[,\s]+(\d+(?:\.\d+)?)%[,\s]+(\d+(?:\.\d+)?)%/i))) {
      return hslToRgb(+m[1], +m[2], +m[3]);
    }
    return null;
  }

  function rgbToHex(r, g, b) {
    const hex = (n) => n.toString(16).padStart(2, '0');
    return '#' + hex(r) + hex(g) + hex(b);
  }

  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if (max === min) { h = 0; s = 0; }
    else {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        default: h = (r - g) / d + 4;
      }
      h *= 60;
    }
    return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
  }

  function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    const k = (n) => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return { r: Math.round(255 * f(0)), g: Math.round(255 * f(8)), b: Math.round(255 * f(4)) };
  }

  function luminance({ r, g, b }) {
    const to = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
    return 0.2126 * to(r) + 0.7152 * to(g) + 0.0722 * to(b);
  }

  window['ai_edge_gallery_get_result'] = async (dataStr) => {
    try {
      const input = JSON.parse(dataStr);
      const color = parseColor(input.color);
      const op = String(input.operation ?? 'convert').toLowerCase();
      if (!color) return JSON.stringify({ result: `Couldn't parse color "${input.color}".` });

      if (op === 'contrast') {
        const other = parseColor(input.against);
        if (!other) return JSON.stringify({ result: `Couldn't parse second color "${input.against}".` });
        const l1 = luminance(color), l2 = luminance(other);
        const ratio = (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
        const grade = ratio >= 7 ? 'AAA' : ratio >= 4.5 ? 'AA' : ratio >= 3 ? 'AA Large' : 'Fail';
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ a: color, b: other, ratio }));
        return JSON.stringify({
          result: `Contrast ratio: ${ratio.toFixed(2)}:1 (${grade})\n${rgbToHex(color.r, color.g, color.b)} vs ${rgbToHex(other.r, other.g, other.b)}`,
          webview: { url: 'display.html' },
        });
      }

      const hex = rgbToHex(color.r, color.g, color.b);
      const hsl = rgbToHsl(color.r, color.g, color.b);
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ a: color, hex, hsl }));
      return JSON.stringify({
        result: `HEX: ${hex}\nRGB: rgb(${color.r}, ${color.g}, ${color.b})\nHSL: hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`,
        webview: { url: 'display.html' },
      });
    } catch (e) {
      return JSON.stringify({ error: `Color Tools error: ${e.message}` });
    }
  };
</script>
</body>
</html>
