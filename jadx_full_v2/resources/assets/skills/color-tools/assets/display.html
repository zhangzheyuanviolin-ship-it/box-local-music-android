<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Tools</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #1a1a2e; color: #fff; min-height: 100vh; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 480px; }
    h1 { text-align: center; font-size: 1.6rem; margin-bottom: 20px; background: linear-gradient(to right, #4ecca3, #45b7d1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .swatch { width: 100%; height: 140px; border-radius: 20px; margin-bottom: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; font-family: 'Courier New', monospace; font-size: 1.1rem; font-weight: 700; }
    .row { display: flex; gap: 10px; margin-bottom: 10px; }
    .pair { flex: 1; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .card:active { transform: scale(0.98); }
    .label { font-size: 0.75rem; color: rgba(255,255,255,0.55); text-transform: uppercase; letter-spacing: 0.5px; }
    .value { font-family: 'Courier New', monospace; font-size: 0.95rem; color: #4ecca3; word-break: break-all; }
    .contrast-info { text-align: center; padding: 16px; background: rgba(255,255,255,0.06); border-radius: 14px; margin-top: 8px; }
    .ratio { font-size: 2rem; font-weight: 700; color: #4ecca3; }
    .grade { font-size: 1rem; color: rgba(255,255,255,0.7); margin-top: 4px; }
    .empty { text-align: center; color: rgba(255,255,255,0.55); margin-top: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Color Tools</h1>
    <div id="content"></div>
  </div>
  <script>
    const data = JSON.parse(localStorage.getItem('color_tools_result') || '{}');
    const rgb = (c) => `rgb(${c.r}, ${c.g}, ${c.b})`;
    const hex = (c) => '#' + [c.r, c.g, c.b].map(n => n.toString(16).padStart(2, '0')).join('');
    const lum = ({r,g,b}) => {
      const to = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
      return 0.2126 * to(r) + 0.7152 * to(g) + 0.0722 * to(b);
    };
    const content = document.getElementById('content');

    if (data.ratio != null) {
      const grade = data.ratio >= 7 ? 'AAA · Excellent' : data.ratio >= 4.5 ? 'AA · Good' : data.ratio >= 3 ? 'AA Large · OK for large text' : 'Fail · Not accessible';
      content.innerHTML = `
        <div class="row">
          <div class="pair"><div class="swatch" style="background:${rgb(data.a)};color:${lum(data.a) > 0.179 ? '#000' : '#fff'}">${hex(data.a)}</div></div>
          <div class="pair"><div class="swatch" style="background:${rgb(data.b)};color:${lum(data.b) > 0.179 ? '#000' : '#fff'}">${hex(data.b)}</div></div>
        </div>
        <div class="contrast-info">
          <div class="ratio">${data.ratio.toFixed(2)}:1</div>
          <div class="grade">${grade}</div>
        </div>
      `;
    } else if (data.a) {
      const c = data.a;
      content.innerHTML = `
        <div class="swatch" style="background:${rgb(c)};color:${lum(c) > 0.179 ? '#000' : '#fff'}">${data.hex}</div>
        ${makeCard('HEX', data.hex)}
        ${makeCard('RGB', `rgb(${c.r}, ${c.g}, ${c.b})`)}
        ${makeCard('HSL', `hsl(${data.hsl.h}, ${data.hsl.s}%, ${data.hsl.l}%)`)}
      `;
      document.querySelectorAll('.card').forEach(el => {
        el.addEventListener('click', () => {
          const v = el.querySelector('.value').textContent;
          navigator.clipboard.writeText(v);
          const orig = el.querySelector('.label').textContent;
          el.querySelector('.label').textContent = 'Copied!';
          setTimeout(() => el.querySelector('.label').textContent = orig, 1500);
        });
      });
    } else {
      content.innerHTML = '<div class="empty">No color data.</div>';
    }

    function makeCard(label, value) {
      return `<div class="card"><span class="label">${label}</span><span class="value">${value}</span></div>`;
    }
  </script>
</body>
</html>
