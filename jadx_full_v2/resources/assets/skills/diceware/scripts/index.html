  window['ai_edge_gallery_get_result'] = async (dataStr) => {
    try {
      const input = JSON.parse(dataStr);
      const numWords = Math.min(Math.max(parseInt(input.words ?? 5), 3), 12);
      const separator = String(input.separator ?? '-');
      const count = Math.min(Math.max(parseInt(input.count ?? 1), 1), 10);
      const capitalize = input.capitalize === true;

      function pick() {
        const buf = new Uint32Array(1);
        crypto.getRandomValues(buf);
        const w = WORDS[buf[0] % WORDS.length];
        return capitalize ? w.charAt(0).toUpperCase() + w.slice(1) : w;
      }
      function makeOne() {
        const words = Array.from({ length: numWords }, pick);
        return words.join(separator);
      }

      const phrases = Array.from({ length: count }, makeOne);
      const entropyPerWord = Math.log2(WORDS.length);
      const totalEntropy = Math.round(entropyPerWord * numWords * 10) / 10;
      const header = `${count} passphrase${count > 1 ? 's' : ''} (${numWords} words · ~${totalEntropy} bits entropy)`;
      const list = count === 1 ? phrases[0] : phrases.map((p, i) => `${i + 1}. ${p}`).join('\n');
      return JSON.stringify({ result: `${header}\n${list}` });
    } catch (e) {
      return JSON.stringify({ error: `Diceware error: ${e.message}` });
    }
  };
