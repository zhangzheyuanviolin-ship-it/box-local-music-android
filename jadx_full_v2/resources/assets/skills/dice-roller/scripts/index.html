<!DOCTYPE html>
<html lang="en">
<body>
<script>
  function rollOne(sides) {
    const buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    return (buf[0] % sides) + 1;
  }

  function parseTerm(term) {
    const m = term.match(/^(\d*)d(\d+)([+-]\d+)?$/i);
    if (!m) return null;
    const count = parseInt(m[1] || '1');
    const sides = parseInt(m[2]);
    const mod = m[3] ? parseInt(m[3]) : 0;
    if (count < 1 || count > 100 || sides < 2 || sides > 1000) return null;
    return { count, sides, mod };
  }

  window['ai_edge_gallery_get_result'] = async (dataStr) => {
    try {
      const input = JSON.parse(dataStr);
      const notation = String(input.notation ?? '').trim();
      const rolls = Math.min(Math.max(parseInt(input.rolls ?? 1), 1), 20);
      if (!notation) return JSON.stringify({ error: 'No dice notation provided.' });

      const terms = notation.split(/[\s,]+/).filter(Boolean);
      const parsed = terms.map(parseTerm);
      if (parsed.some(p => p === null)) {
        return JSON.stringify({ result: `Couldn't parse "${notation}". Use notation like 2d6+3 or 1d20.` });
      }

      const allLines = [];
      let grandTotal = 0;
      for (let r = 0; r < rolls; r++) {
        const parts = [];
        let totalForRoll = 0;
        parsed.forEach(({ count, sides, mod }) => {
          const dice = Array.from({ length: count }, () => rollOne(sides));
          const sum = dice.reduce((a, b) => a + b, 0) + mod;
          totalForRoll += sum;
          const modStr = mod === 0 ? '' : (mod > 0 ? `+${mod}` : `${mod}`);
          parts.push(`${count}d${sides}${modStr}: [${dice.join(',')}]${mod !== 0 ? ` ${modStr}` : ''} = ${sum}`);
        });
        allLines.push(`${rolls > 1 ? `Roll ${r + 1}: ` : ''}${parts.join(' | ')} → total ${totalForRoll}`);
        grandTotal += totalForRoll;
      }

      const footer = rolls > 1 ? `\n\nGrand total: ${grandTotal} · Average: ${(grandTotal / rolls).toFixed(2)}` : '';
      return JSON.stringify({ result: allLines.join('\n') + footer });
    } catch (e) {
      return JSON.stringify({ error: `Dice Roller error: ${e.message}` });
    }
  };
</script>
</body>
</html>
