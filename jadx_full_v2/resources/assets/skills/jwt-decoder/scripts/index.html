<!DOCTYPE html>
<html lang="en">
<body>
<script>
  function b64urlDecode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return atob(s);
  }

  window['ai_edge_gallery_get_result'] = async (dataStr) => {
    try {
      const input = JSON.parse(dataStr);
      const jwt = String(input.jwt ?? '').trim();
      if (!jwt) return JSON.stringify({ error: 'No JWT provided.' });

      const parts = jwt.split('.');
      if (parts.length !== 3) {
        return JSON.stringify({ result: `Not a valid JWT: expected 3 parts, got ${parts.length}.` });
      }

      const [headerB64, payloadB64, signatureB64] = parts;
      let header, payload;
      try {
        header = JSON.parse(b64urlDecode(headerB64));
      } catch (e) {
        return JSON.stringify({ result: `Invalid header: ${e.message}` });
      }
      try {
        payload = JSON.parse(b64urlDecode(payloadB64));
      } catch (e) {
        return JSON.stringify({ result: `Invalid payload: ${e.message}` });
      }

      const lines = [];
      lines.push(`Algorithm: ${header.alg || 'unknown'}`);
      if (header.typ) lines.push(`Type: ${header.typ}`);

      if (payload.exp) {
        const expDate = new Date(payload.exp * 1000);
        const now = Date.now();
        const delta = payload.exp * 1000 - now;
        const status = delta > 0 ? `expires in ${Math.round(delta / 1000 / 60)} min` : `EXPIRED ${Math.round(-delta / 1000 / 60)} min ago`;
        lines.push(`Expiry: ${expDate.toISOString()} (${status})`);
      }
      if (payload.iat) lines.push(`Issued at: ${new Date(payload.iat * 1000).toISOString()}`);
      if (payload.iss) lines.push(`Issuer: ${payload.iss}`);
      if (payload.sub) lines.push(`Subject: ${payload.sub}`);
      if (payload.aud) lines.push(`Audience: ${JSON.stringify(payload.aud)}`);

      const headerJson = JSON.stringify(header, null, 2);
      const payloadJson = JSON.stringify(payload, null, 2);

      const result =
        `${lines.join('\n')}\n\n` +
        `Header:\n${headerJson}\n\n` +
        `Payload:\n${payloadJson}\n\n` +
        `Signature: ${signatureB64.slice(0, 32)}${signatureB64.length > 32 ? '...' : ''} (not verified)`;

      return JSON.stringify({ result });
    } catch (e) {
      return JSON.stringify({ error: `JWT Decoder error: ${e.message}` });
    }
  };
</script>
</body>
</html>
