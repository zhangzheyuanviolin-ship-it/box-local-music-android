<!DOCTYPE html>
<html lang="en">
<body>
<script>
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function parseDate(s) {
    if (!s) return null;
    const d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }

  window['ai_edge_gallery_get_result'] = async (dataStr) => {
    try {
      const input = JSON.parse(dataStr);
      const op = String(input.operation ?? 'between').toLowerCase();
      const d1 = parseDate(input.date1);
      const d2 = parseDate(input.date2) ?? new Date();

      if (!d1) return JSON.stringify({ error: `Could not parse date1: "${input.date1}".` });

      if (op === 'weekday') {
        return JSON.stringify({ result: `${d1.toISOString().slice(0,10)} is a ${DAYS[d1.getDay()]}.` });
      }

      const ms = d2.getTime() - d1.getTime();
      const days = Math.floor(Math.abs(ms) / 86400000);
      const weeks = Math.floor(days / 7);

      if (op === 'age') {
        let years = d2.getFullYear() - d1.getFullYear();
        const m = d2.getMonth() - d1.getMonth();
        if (m < 0 || (m === 0 && d2.getDate() < d1.getDate())) years--;
        const months = Math.floor(days / 30.4375);
        return JSON.stringify({
          result: `Age as of ${d2.toISOString().slice(0,10)}: ${years} years (~${months} months, ${days} days total).`,
        });
      }

      // between
      const dir = ms >= 0 ? 'after' : 'before';
      let years = Math.abs(d2.getFullYear() - d1.getFullYear());
      const months = Math.floor(days / 30.4375);
      return JSON.stringify({
        result: `${d2.toISOString().slice(0,10)} is ${days} days (~${weeks} weeks, ~${months} months, ~${years} years) ${dir} ${d1.toISOString().slice(0,10)}.`,
      });
    } catch (e) {
      return JSON.stringify({ error: `Date Math error: ${e.message}` });
    }
  };
</script>
</body>
</html>
